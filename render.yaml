




services:
  - type: web
    name: studyquest-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && node -e "require('node:fs').accessSync('dist/server.js')"
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_ENV
        value: production


      - key: ENABLE_DEMO_MODE
        value: "true"

      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
