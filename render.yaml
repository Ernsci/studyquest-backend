# Render Blueprint for the StudyQuest API.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. This
# repository *is* the service, so no `rootDir` is needed. Secrets are marked
# `sync: false`: Render prompts for them instead of storing them here.
services:
  - type: web
    name: studyquest-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && node -e "require('node:fs').accessSync('dist/server.js')"
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_ENV
        value: production
      # Bundled sample content keeps working before Supabase is connected.
      # Demo *accounts* are automatically refused once SUPABASE_URL is set.
      - key: ENABLE_DEMO_MODE
        value: "true"
      # The Vercel origin(s) allowed to call this API, comma separated.
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
